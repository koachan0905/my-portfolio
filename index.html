<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Cafe Lumiere</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    color: #333;
    background: #faf7f2;
}

.navbar {
    position: sticky;
    top: 0;
    z-index: 100;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 18px 40px;
    background: white;
}

.logo {
    font-size: 22px;
    font-weight: bold;
}

.nav-links {
    display: flex;
    gap: 25px;
}

.nav-links a {
    color: #333;
    text-decoration: none;
}

.hero {
    min-height: 70vh;
    display: flex;
    justify-content: center;
    align-items: center;
    text-align: center;
    background: #8b6f5a;
    color: white;
}

.hero h1 {
    font-size: 64px;
    margin: 0;
}

.hero p {
    font-size: 20px;
}

section {
    max-width: 1000px;
    margin: 70px auto;
    padding: 30px 20px;
}

.section-title {
    text-align: center;
    font-size: 36px;
    margin-bottom: 40px;
}

.menu-image {
    display: block;
    width: 100%;
    max-width: 900px;
    margin: 0 auto 40px;
    border-radius: 15px;
}

.menu {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 25px;
}

.menu-card {
    background: white;
    padding: 30px;
    border-radius: 15px;
    text-align: center;
    box-shadow: 0 5px 20px rgba(0,0,0,0.08);
}

.price {
    font-size: 20px;
    font-weight: bold;
}

.info {
    background: white;
    padding: 40px;
    border-radius: 15px;
}

.button {
    display: inline-block;
    margin-top: 20px;
    padding: 14px 30px;
    background: white;
    color: #333;
    text-decoration: none;
    border-radius: 30px;
}

@media (max-width: 600px) {
    .navbar {
        padding: 15px 20px;
    }

    .nav-links {
        gap: 10px;
    }

    .nav-links a {
        font-size: 12px;
    }

    .hero h1 {
        font-size: 42px;
    }

    .menu {
        grid-template-columns: 1fr;
    }
}
</style>
</head>

<body>

<nav class="navbar">
    <div class="logo">Cafe Lumiere</div>

    <div class="nav-links">
        <a href="#">HOME</a>
        <a href="#menu">MENU</a>
        <a href="#about">ABOUT</a>
        <a href="#access">ACCESS</a>
    </div>
</nav>

<header class="hero">
    <div>
        <h1>Cafe Lumiere</h1>
        <p>ゆっくりとした時間を、あなたに。</p>

        <a href="#menu" class="button">
            MENUを見る
        </a>
    </div>
</header>

<section id="menu">

    <h2 class="section-title">MENU</h2>

    <img src="menu.jpg" alt="Cafe Lumiereのメニュー" class="menu-image">
</section>

<section id="about">

    <h2 class="section-title">ABOUT</h2>

    <div class="info">
        <h3>Cafe Lumiereについて</h3>

        <p>
            Cafe Lumiereは、
            ゆっくりとした時間を楽しめる
            小さなカフェです。
        </p>

        <p>
            コーヒーと手作りスイーツを
            お楽しみください。
        </p>
    </div>

</section>

<section id="access">

    <h2 class="section-title">ACCESS</h2>

    <div class="info">
        <p>東京都○○区○○1-2-3</p>
        <p>営業時間：10:00?19:00</p>
        <p>定休日：火曜日</p>
    </div>

</section>

</body>
</html>
